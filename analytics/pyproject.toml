[project]
name = "metapro-analytics"
version = "0.1.0"
description = "Analytics for Metapro Viz (exploration and future transform)"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5",
    "jupysql>=0.11",
    "jupyter>=1.1",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["exploration/scripts"]
