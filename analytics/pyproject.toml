[project]
name = "metapro-analytics"
version = "0.1.0"
description = "Analytics for Metapro Viz (exploration and future transform)"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5",
    "jupysql>=0.11",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "dbt-core==1.12.0b1",
    "dbt-duckdb>=1.10.1",
    "mashumaro>=3.17,<3.18",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["exploration/scripts", "transform/tests/python"]
pythonpath = [".."]
