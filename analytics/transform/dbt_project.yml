name: 'rpkm_transform'
version: '1.0.0'
config-version: 2

profile: 'rpkm_transform'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  tax_rank: "phylum"
  pathway_level: "pathway"
  reference_parquet_dir: "transform/reference/parquet"
  rpkm_path: ""
  sample_id: ""
  # raw_parquet_dir: for build_reference.py only, not used by dbt models

models:
  rpkm_transform:
    staging:
      +materialized: table
      +rpkm_path: "{{ var('rpkm_path', '') }}"
      +sample_id: "{{ var('sample_id', '') }}"
    intermediate:
      +materialized: table
    marts:
      +materialized: table
